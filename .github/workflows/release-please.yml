name: release-please

# Automates versioning + releases from Conventional Commit messages. It reads the
# commit history on `main` — so it picks up commits pushed straight to main *and*
# commits that arrive via a merged branch/PR, as long as the message follows the
# feat:/fix:/… convention.
#
# On every push to main it opens/updates a single "release PR" (titled e.g.
# "chore(main): release 0.2.0") that bumps CHANGELOG.md and manifest.json. Merging
# that PR is the release: it creates the vX.Y.Z tag and the GitHub Release, with
# manifest.json already carrying the matching version (so HACS installs the right
# one). Nothing to tag or bump by hand.
#
# Prereleases: force one with a `Release-As: 0.1.0-rc.1` commit footer. release-
# please doesn't set the GitHub "pre-release" flag on its own (turning its
# `prerelease` config on would wrongly flag every pre-1.0 stable release too), so
# the final step below flags any release whose tag has a SemVer prerelease suffix
# (a hyphen, e.g. -rc.1/-beta). That keeps it out of HACS for non-beta users.
on:
  push:
    branches: [main]

permissions:
  contents: write # create the release PR, tag and GitHub Release
  pull-requests: write # open/update the release PR

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Flag prerelease versions (tag contains a hyphen) as GitHub pre-releases,
      # and drop them from "latest". Only runs when a release was actually cut.
      - name: Mark prereleases
        if: ${{ steps.release.outputs.release_created == 'true' && contains(steps.release.outputs.tag_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false
