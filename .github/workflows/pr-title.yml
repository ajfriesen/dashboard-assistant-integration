name: PR title

# Guardrail for the release-please flow: a squash-merged PR uses the PR *title*
# as its commit message, and release-please derives the changelog + version bump
# from that message. So the title must be a valid Conventional Commit, e.g.
# "feat: add rotation select" or "fix(api): handle missing battery".
#
# (Commits pushed straight to main can't be checked before they land — this only
# covers branch work that arrives via a PR. Keep those direct commits Conventional
# by hand.)
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed types — keep in step with release-please's categories.
          types: |
            feat
            fix
            docs
            chore
            refactor
            perf
            test
            build
            ci
            style
            revert
